# Windows on ARM: package the ARM64 release the way the release workflows do (cross-compiled on an x64
# runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner, check the installed
# binaries are ARM64, run the CLI natively, and uninstall. (A native ARM64 `cargo test` job is left
# out for now: PdfCraft saw an intermittent access violation in egui UI tests there.)
name: Windows ARM64

# Nightly on main (dependency and runner-image drift shows up within a day), and on PRs that
# change the Windows packaging itself.
on:
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    uses: getnodalia/foundation/.github/workflows/windows-arm64.yml@c37ef19e6bc213e3ebf3a281f1bf0f3fd7c5d495 # foundation main
    with:
      app-name: lienzo
      cli-name: lienzo-cli
      fonts-repository: getnodalia/foundation
      fonts-ref: f9a5f30b74d90b69cffdb7042bb0b339400ed06d # nodalia/fonts
